<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Catalogue Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --accent:#f59e0b; --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text);
  }
  header{
    padding:20px 24px; background:#111827; display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:12px; border-bottom:2px solid var(--accent);
  }
  header h1{ margin:0; font-size:22px; }
  header h1 span{ color:var(--accent); }
  .top-actions button{
    background:var(--accent); border:none; color:#111827; font-weight:600; padding:10px 16px;
    border-radius:8px; cursor:pointer; margin-left:8px; font-size:14px;
  }
  .top-actions button.secondary{ background:#334155; color:var(--text); }

  #addForm{
    display:flex; gap:12px; flex-wrap:wrap; padding:20px 24px; background:var(--card);
    align-items:center; margin:16px 24px; border-radius:12px;
  }
  #addForm input[type=text], #addForm input[type=number]{
    padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text);
    font-size:14px;
  }
  #addForm input[type=text]{ flex:1; min-width:160px; }
  #addForm input[type=number]{ width:110px; }
  #addForm label.fileBtn{
    background:#334155; padding:10px 14px; border-radius:8px; cursor:pointer; font-size:14px;
  }
  #addForm input[type=file]{ display:none; }
  #addForm button{
    background:var(--accent); border:none; color:#111827; font-weight:700; padding:10px 20px;
    border-radius:8px; cursor:pointer; font-size:14px;
  }
  #preview{
    width:44px; height:44px; border-radius:8px; object-fit:cover; display:none; border:1px solid #334155;
  }

  #grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:18px;
    padding:0 24px 40px;
  }
  .item{
    background:var(--card); border-radius:12px; overflow:hidden; position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.3); display:flex; flex-direction:column;
  }
  .item img{ width:100%; height:180px; object-fit:cover; background:#0f172a; }
  .item .info{ padding:12px 14px; }
  .item .name{ font-weight:700; font-size:15px; margin-bottom:4px; word-break:break-word; }
  .item .price{ color:var(--accent); font-weight:700; font-size:14px; }
  .item .del{
    position:absolute; top:8px; right:8px; background:rgba(15,23,42,.8); color:#f87171;
    border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px; font-weight:700;
  }
  .empty{ padding:60px 24px; text-align:center; color:var(--muted); font-size:15px; }

  @media (max-width: 640px){
    header{ padding:14px 16px; }
    header h1{ font-size:18px; }
    .top-actions{ width:100%; display:flex; gap:8px; }
    .top-actions button{ flex:1; margin-left:0; padding:10px 8px; font-size:13px; }
    #addForm{ margin:12px; padding:14px; flex-direction:column; align-items:stretch; }
    #addForm .fileRow{ display:flex; gap:8px; }
    #addForm .fileBtn{ flex:1; text-align:center; }
    #addForm input[type=text], #addForm input[type=number]{ width:100%; }
    #preview{ align-self:center; }
    #addForm button{ width:100%; padding:14px; font-size:15px; }
    #grid{ grid-template-columns:repeat(2, 1fr); gap:12px; padding:0 12px 30px; }
    .item .name{ font-size:13px; }
  }
  @media (max-width: 380px){
    #grid{ grid-template-columns:1fr; }
  }

  @media print{
    header, #addForm, .del, .no-print{ display:none !important; }
    body{ background:#fff; color:#000; }
    #grid{ padding:0; }
    .item{ box-shadow:none; border:1px solid #ccc; break-inside:avoid; }
    .price{ color:#000; }
  }
</style>
</head>
<body>

<header>
  <h1>My <span>Catalogue</span></h1>
  <div class="top-actions no-print">
    <button class="secondary" onclick="window.print()">Print / Save PDF</button>
    <button onclick="downloadPDF()">Download PDF</button>
  </div>
</header>

<form id="addForm" onsubmit="return addItem(event)">
  <div class="fileRow">
  <label class="fileBtn" for="cameraInput">📸 Camera</label>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="showPreview(event)">
  <label class="fileBtn" for="galleryInput">🖼️ Gallery</label>
  <input type="file" id="galleryInput" accept="image/*" onchange="showPreview(event)">
  </div>
  <img id="preview">
  <input type="text" id="nameInput" placeholder="Product name" required>
  <input type="number" id="priceInput" placeholder="Price (optional)" min="0">
  <button type="submit">Add to Catalogue</button>
</form>

<div id="grid"></div>

<script>
let items = [];
let tempImage = null;

function showPreview(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    tempImage = ev.target.result;
    const prev = document.getElementById('preview');
    prev.src = tempImage;
    prev.style.display = 'inline-block';
  };
  reader.readAsDataURL(file);
}

function addItem(e){
  e.preventDefault();
  const name = document.getElementById('nameInput').value.trim();
  const price = document.getElementById('priceInput').value;
  if(!name){ return false; }

  items.push({
    id: Date.now(),
    name: name,
    price: price,
    img: tempImage
  });

  document.getElementById('nameInput').value = '';
  document.getElementById('priceInput').value = '';
  document.getElementById('cameraInput').value = '';
  document.getElementById('galleryInput').value = '';
  tempImage = null;
  document.getElementById('preview').style.display = 'none';

  render();
  return false;
}

function deleteItem(id){
  items = items.filter(i => i.id !== id);
  render();
}

function render(){
  const grid = document.getElementById('grid');
  if(items.length === 0){
    grid.innerHTML = '<div class="empty">Abhi koi product add nahi hua. Upar se photo aur naam daalo 👆</div>';
    return;
  }
  grid.innerHTML = items.map(i => `
    <div class="item">
      <button class="del no-print" onclick="deleteItem(${i.id})">✕</button>
      ${i.img ? `<img src="${i.img}">` : `<img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='180'><rect width='100%25' height='100%25' fill='%231e293b'/></svg>">`}
      <div class="info">
        <div class="name">${escapeHtml(i.name)}</div>
        ${i.price ? `<div class="price">₹${i.price}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.innerText = str;
  return d.innerHTML;
}

async function downloadPDF(){
  if(items.length === 0){ alert('Pehle products add karo.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 30;
  const cols = 3;
  const gap = 15;
  const cardW = (pageW - margin*2 - gap*(cols-1)) / cols;
  const imgH = cardW * 0.75;
  const cardH = imgH + 45;

  let x = margin, y = margin, col = 0;

  for(const item of items){
    if(y + cardH > pageH - margin){
      doc.addPage();
      x = margin; y = margin; col = 0;
    }

    if(item.img){
      try{ doc.addImage(item.img, 'JPEG', x, y, cardW, imgH); }
      catch(e){ doc.addImage(item.img, 'PNG', x, y, cardW, imgH); }
    } else {
      doc.setFillColor(230,230,230);
      doc.rect(x, y, cardW, imgH, 'F');
    }

    doc.setFontSize(11);
    doc.setTextColor(20,20,20);
    doc.text(item.name, x, y + imgH + 15, { maxWidth: cardW });
    if(item.price){
      doc.setFontSize(10);
      doc.setTextColor(180,90,0);
      doc.text('Rs. ' + item.price, x, y + imgH + 30);
    }

    col++;
    if(col >= cols){
      col = 0;
      x = margin;
      y += cardH + gap;
    } else {
      x += cardW + gap;
    }
  }

  doc.save('catalogue.pdf');
}

render();
</script>
</body>
</html>
