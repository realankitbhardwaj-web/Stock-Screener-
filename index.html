<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renko Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D10; --panel:#12161B; --panel2:#161B21; --border:#1E252B;
    --txt:#E8EAED; --muted:#6B7680; --muted2:#4A535C;
    --up:#12B886; --up-dim:#0E3A2E; --down:#F0506E; --down-dim:#3A1420;
    --amber:#F5A623;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:'Inter',sans-serif;
    height:100vh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    display:flex; align-items:center; gap:16px;
    padding:10px 16px; border-bottom:1px solid var(--border);
    background:var(--panel); flex-shrink:0; flex-wrap:wrap;
  }
  .logo{font-weight:700; font-size:15px; letter-spacing:0.5px;}
  .logo span{color:var(--amber);}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
  .tab{
    padding:6px 12px; border-radius:6px; border:1px solid var(--border);
    background:var(--panel2); color:var(--muted); font-size:12.5px; font-weight:600;
    cursor:pointer; font-family:'JetBrains Mono',monospace; transition:all .15s;
  }
  .tab:hover{color:var(--txt); border-color:var(--muted2);}
  .tab.active{background:var(--amber); color:#1A1300; border-color:var(--amber);}
  .status{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);
    padding:5px 10px; border:1px solid var(--border); border-radius:6px; white-space:nowrap;
  }
  .dot{width:7px; height:7px; border-radius:50%; background:var(--muted2);}
  .dot.live{background:var(--up); box-shadow:0 0 6px var(--up); animation:pulse 1.4s infinite;}
  .dot.poll{background:var(--amber); box-shadow:0 0 6px var(--amber); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .controls{display:flex; align-items:center; gap:10px; padding:8px 16px; background:var(--panel);
    border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0;}
  .ctrl-group{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);}
  input[type=text],input[type=number]{
    background:var(--panel2); border:1px solid var(--border); color:var(--txt);
    padding:5px 8px; border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:12px; width:90px;
  }
  select{background:var(--panel2); border:1px solid var(--border); color:var(--txt);
    padding:5px 8px; border-radius:5px; font-size:12px;}
  button.btn{
    background:var(--panel2); border:1px solid var(--border); color:var(--txt);
    padding:6px 12px; border-radius:5px; font-size:12px; cursor:pointer; font-weight:600;
  }
  button.btn:hover{border-color:var(--amber); color:var(--amber);}

  main{flex:1; display:flex; min-height:0;}
  .chart-wrap{flex:1; position:relative; min-width:0;}
  canvas{display:block; width:100%; height:100%;}
  .crosshair-tip{
    position:absolute; background:var(--panel2); border:1px solid var(--border);
    border-radius:5px; padding:6px 9px; font-size:11px; pointer-events:none; display:none;
    font-family:'JetBrains Mono',monospace; line-height:1.5; z-index:5;
  }

  aside{
    width:230px; border-left:1px solid var(--border); background:var(--panel);
    padding:14px; flex-shrink:0; overflow-y:auto;
  }
  .price-big{font-size:28px; font-weight:700; font-family:'JetBrains Mono',monospace;}
  .price-sub{font-size:11px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.5px;}
  .stat-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:12px;}
  .stat-row span:first-child{color:var(--muted);}
  .stat-row span:last-child{font-family:'JetBrains Mono',monospace; font-weight:600;}
  .tape-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin:16px 0 8px;}
  .tape-item{
    display:flex; justify-content:space-between; font-size:11.5px; padding:5px 6px;
    border-radius:4px; margin-bottom:3px; font-family:'JetBrains Mono',monospace;
  }
  .tape-item.up{background:var(--up-dim); color:var(--up);}
  .tape-item.down{background:var(--down-dim); color:var(--down);}
  .note{font-size:10.5px; color:var(--muted2); margin-top:14px; line-height:1.5;}
</style>
</head>
<body>

<header>
  <div class="logo">RENKO<span>::</span>TERMINAL</div>
  <div class="tabs" id="tabs"></div>
  <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">idle</span></div>
</header>

<div class="controls">
  <div class="ctrl-group">Brick Size
    <input type="number" id="brickSizeInput" step="any">
  </div>
  <button class="btn" id="resetBtn">Reset Bricks</button>
  <div class="ctrl-group" style="margin-left:auto;">
    <input type="text" id="customTicker" placeholder="e.g. SILVER=F or DOGEUSDT">
    <select id="customType">
      <option value="yahoo">Yahoo (delayed)</option>
      <option value="crypto">Binance (live)</option>
    </select>
    <button class="btn" id="addCustomBtn">+ Add</button>
  </div>
</div>

<main>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
    <div class="crosshair-tip" id="tip"></div>
  </div>
  <aside>
    <div class="price-big mono" id="lastPrice">--</div>
    <div class="price-sub" id="lastSymbol">SELECT SYMBOL</div>
    <div style="margin-top:16px;">
      <div class="stat-row"><span>Session High</span><span id="statHigh">--</span></div>
      <div class="stat-row"><span>Session Low</span><span id="statLow">--</span></div>
      <div class="stat-row"><span>Up Bricks</span><span id="statUp" style="color:var(--up);">0</span></div>
      <div class="stat-row"><span>Down Bricks</span><span id="statDown" style="color:var(--down);">0</span></div>
      <div class="stat-row"><span>Ticks Received</span><span id="statTicks">0</span></div>
    </div>
    <div class="tape-title">Recent Bricks</div>
    <div id="tape"></div>
    <div class="note" id="dataNote"></div>
  </aside>
</main>

<script>
// ---------- symbol config ----------
const SYMBOLS = {
  XAUUSD: {type:'yahoo', ticker:'XAUUSD=X', brick:0.50, dp:2},
  XAGUSD: {type:'yahoo', ticker:'XAGUSD=X', brick:0.02, dp:3},
  USOIL:  {type:'yahoo', ticker:'CL=F',     brick:0.05, dp:2},
  EURUSD: {type:'yahoo', ticker:'EURUSD=X', brick:0.0005, dp:5},
  GBPUSD: {type:'yahoo', ticker:'GBPUSD=X', brick:0.0005, dp:5},
  USDJPY: {type:'yahoo', ticker:'USDJPY=X', brick:0.05, dp:3},
  BTCUSDT:{type:'crypto',ticker:'btcusdt',  brick:20,   dp:2},
  ETHUSDT:{type:'crypto',ticker:'ethusdt',  brick:2,    dp:2},
};
let customSymbols = {};

// ---------- state ----------
let currentKey = null;
let bricks = [];          // {open, close, dir, time}
let lastClose = null;     // last brick boundary price
let pendingDir = 0;       // current direction (-1,0,1) for reversal logic
let sessionHigh = -Infinity, sessionLow = Infinity, tickCount = 0;
let ws = null, pollTimer = null, watchdogTimer = null;
let lastFeedError = null;

const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');

function dpr(){ return window.devicePixelRatio || 1; }
function resizeCanvas(){
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  canvas.width = w * dpr(); canvas.height = h * dpr();
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  ctx.setTransform(dpr(),0,0,dpr(),0,0);
  draw();
}
window.addEventListener('resize', resizeCanvas);

// ---------- renko engine ----------
function feedPrice(price){
  lastFeedError = null;
  tickCount++;
  document.getElementById('statTicks').textContent = tickCount;
  if(price > sessionHigh) sessionHigh = price;
  if(price < sessionLow) sessionLow = price;
  document.getElementById('statHigh').textContent = fmt(sessionHigh);
  document.getElementById('statLow').textContent = fmt(sessionLow);
  document.getElementById('lastPrice').textContent = fmt(price);

  const cfg = getCfg(currentKey);
  const size = cfg.brick;

  if(lastClose === null){
    lastClose = Math.round(price / size) * size;
    draw();
    return;
  }

  let diff = price - lastClose;

  // classic renko: continuation needs 1 brick, reversal needs 2 bricks
  while(true){
    const needed = (pendingDir === 0) ? size : (Math.sign(diff) === pendingDir ? size : size*2);
    if(Math.abs(diff) < needed) break;

    const dir = Math.sign(diff);
    if(pendingDir !== 0 && dir !== pendingDir){
      // reversal: consumes 2x brick, first brick forms at reversal point
      const open = lastClose;
      const close = lastClose + dir*size;
      bricks.push({open, close, dir, time: Date.now()});
      lastClose = close;
      diff = price - lastClose;
      pendingDir = dir;
    } else {
      const open = lastClose;
      const close = lastClose + dir*size;
      bricks.push({open, close, dir, time: Date.now()});
      lastClose = close;
      diff = price - lastClose;
      pendingDir = dir;
    }
    addTapeItem(bricks[bricks.length-1]);
  }
  if(bricks.length > 300) bricks.splice(0, bricks.length-300);
  updateCounts();
  draw();
}

function fmt(v){
  const cfg = getCfg(currentKey);
  return v.toFixed(cfg ? cfg.dp : 2);
}

function updateCounts(){
  const up = bricks.filter(b=>b.dir===1).length;
  const down = bricks.filter(b=>b.dir===-1).length;
  document.getElementById('statUp').textContent = up;
  document.getElementById('statDown').textContent = down;
}

function addTapeItem(b){
  const el = document.createElement('div');
  el.className = 'tape-item ' + (b.dir===1?'up':'down');
  const t = new Date(b.time).toLocaleTimeString();
  el.innerHTML = `<span>${t}</span><span>${b.dir===1?'▲':'▼'} ${fmt(b.close)}</span>`;
  const tape = document.getElementById('tape');
  tape.prepend(el);
  while(tape.children.length > 25) tape.removeChild(tape.lastChild);
}

// ---------- drawing ----------
function draw(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  if(!bricks.length){
    ctx.fillStyle = '#4A535C'; ctx.font = '13px Inter'; ctx.textAlign='center';
    ctx.fillText(lastFeedError || 'Waiting for price data…', w/2, h/2);
    if(lastFeedError){
      ctx.fillStyle = '#6B7680'; ctx.font = '11px Inter';
      ctx.fillText('Try the BTCUSDT/ETHUSDT tab (Binance, no proxy needed) or check your network/ad-blocker.', w/2, h/2+22);
    }
    return;
  }
  const padL = 10, padR = 60, padT = 20, padB = 20;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let mn = Infinity, mx = -Infinity;
  bricks.forEach(b=>{ mn = Math.min(mn,b.open,b.close); mx = Math.max(mx,b.open,b.close); });
  const cfg = getCfg(currentKey);
  mn -= cfg.brick*2; mx += cfg.brick*2;
  const yOf = v => padT + plotH - ((v-mn)/(mx-mn))*plotH;

  const n = bricks.length;
  const bw = plotW / Math.max(n, 30);
  const brickW = Math.max(bw*0.72, 2);

  // grid
  ctx.strokeStyle = '#1E252B'; ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const gy = padT + (plotH/4)*i;
    ctx.beginPath(); ctx.moveTo(padL,gy); ctx.lineTo(w-padR,gy); ctx.stroke();
    const val = mx - ((mx-mn)/4)*i;
    ctx.fillStyle = '#6B7680'; ctx.font='10.5px "JetBrains Mono"'; ctx.textAlign='left';
    ctx.fillText(val.toFixed(cfg.dp), w-padR+6, gy+3);
  }

  bricks.forEach((b,i)=>{
    const x = padL + i*bw + (bw-brickW)/2;
    const y1 = yOf(b.open), y2 = yOf(b.close);
    const top = Math.min(y1,y2), hgt = Math.max(Math.abs(y1-y2),1);
    ctx.fillStyle = b.dir===1 ? '#12B886' : '#F0506E';
    ctx.fillRect(x, top, brickW, hgt);
  });

  // last price line
  const lastY = yOf(lastClose);
  ctx.strokeStyle = '#F5A623'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padL,lastY); ctx.lineTo(w-padR,lastY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#F5A623'; ctx.font='11px "JetBrains Mono"'; ctx.textAlign='left';
  ctx.fillText(lastClose.toFixed(cfg.dp), w-padR+6, lastY+3);
}

canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const padL=10, padR=60; const plotW = canvas.clientWidth-padL-padR;
  const n = bricks.length; if(!n) return;
  const bw = plotW / Math.max(n,30);
  const idx = Math.floor((x-padL)/bw);
  if(idx>=0 && idx<n){
    const b = bricks[idx];
    tip.style.display='block';
    tip.style.left = Math.min(x+14, canvas.clientWidth-140)+'px';
    tip.style.top = Math.max(y-40,4)+'px';
    tip.innerHTML = `${new Date(b.time).toLocaleTimeString()}<br>O: ${fmt(b.open)}<br>C: ${fmt(b.close)}<br>${b.dir===1?'▲ UP':'▼ DOWN'}`;
  } else { tip.style.display='none'; }
});
canvas.addEventListener('mouseleave', ()=> tip.style.display='none');

// ---------- data connections ----------
function getCfg(key){ return SYMBOLS[key] || customSymbols[key]; }

function setStatus(mode, text){
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (mode?(' '+mode):'');
  document.getElementById('statusText').textContent = text;
}

function teardown(){
  if(ws){ ws.onclose=null; ws.close(); ws=null; }
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(watchdogTimer){ clearTimeout(watchdogTimer); watchdogTimer=null; }
}

function connectCrypto(cfg){
  setStatus('live','connecting…');
  watchdogTimer = setTimeout(()=>{
    if(tickCount===0){
      lastFeedError = 'No data after 6s. This browser/preview may be blocking outbound WebSocket connections.';
      setStatus('','blocked?');
      draw();
    }
  }, 6000);
  try{
    ws = new WebSocket(`wss://stream.binance.com:9443/ws/${cfg.ticker}@trade`);
  }catch(e){
    lastFeedError = 'WebSocket could not be created: ' + e.message;
    setStatus('','error'); draw();
    return;
  }
  ws.onopen = ()=> setStatus('live','LIVE · Binance tick stream');
  ws.onmessage = ev=>{
    clearTimeout(watchdogTimer);
    const d = JSON.parse(ev.data);
    feedPrice(parseFloat(d.p));
  };
  ws.onerror = ()=>{
    lastFeedError = 'WebSocket connection error — network/firewall likely blocking wss:// to Binance.';
    setStatus('','error'); draw();
  };
  ws.onclose = ()=> setStatus('','disconnected');
}

async function fetchYahoo(ticker){
  const yUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1m&range=1d`;
  const proxies = [
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(yUrl),
    'https://corsproxy.io/?url=' + encodeURIComponent(yUrl),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(yUrl)
  ];
  let lastErr = null;
  for(const p of proxies){
    try{
      const res = await fetch(p);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
      if(typeof price === 'number') return price;
      throw new Error('no price field in response');
    }catch(e){ lastErr = e; /* try next proxy */ }
  }
  throw lastErr || new Error('all proxies failed');
}

function connectYahoo(cfg){
  setStatus('poll','connecting…');
  let failCount = 0;
  const poll = async ()=>{
    try{
      const price = await fetchYahoo(cfg.ticker);
      failCount = 0;
      setStatus('poll','POLLING · delayed quote (~2s)');
      feedPrice(price);
    }catch(e){
      failCount++;
      setStatus('', 'feed error — retrying ('+failCount+')');
      lastFeedError = 'Free data proxy unreachable (' + (e.message||'network error') + ')';
      draw();
      console.error('Yahoo feed error:', e);
    }
  };
  poll();
  pollTimer = setInterval(poll, 2000);
}

function switchSymbol(key){
  teardown();
  currentKey = key;
  bricks = []; lastClose = null; pendingDir = 0;
  sessionHigh = -Infinity; sessionLow = Infinity; tickCount = 0;
  document.getElementById('tape').innerHTML = '';
  document.getElementById('statUp').textContent='0';
  document.getElementById('statDown').textContent='0';
  document.getElementById('statTicks').textContent='0';
  document.getElementById('statHigh').textContent='--';
  document.getElementById('statLow').textContent='--';
  document.getElementById('lastPrice').textContent='--';
  document.getElementById('lastSymbol').textContent = key;

  const cfg = getCfg(key);
  document.getElementById('brickSizeInput').value = cfg.brick;
  document.getElementById('dataNote').textContent = cfg.type==='crypto'
    ? 'Live tick-by-tick stream via Binance public WebSocket.'
    : 'Free unofficial Yahoo Finance feed via CORS proxy, polled every 2s. Delayed / best-effort — not a broker tick feed.';

  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.key===key));

  if(cfg.type==='crypto') connectCrypto(cfg);
  else connectYahoo(cfg);
  resizeCanvas();
}

// ---------- UI wiring ----------
function renderTabs(){
  const wrap = document.getElementById('tabs');
  wrap.innerHTML = '';
  const all = {...SYMBOLS, ...customSymbols};
  Object.keys(all).forEach(key=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (key===currentKey?' active':'');
    btn.textContent = key;
    btn.dataset.key = key;
    btn.onclick = ()=> switchSymbol(key);
    wrap.appendChild(btn);
  });
}

document.getElementById('brickSizeInput').addEventListener('change', e=>{
  const cfg = getCfg(currentKey);
  const v = parseFloat(e.target.value);
  if(v>0){ cfg.brick = v; bricks=[]; lastClose=null; pendingDir=0; document.getElementById('tape').innerHTML=''; draw(); }
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  bricks=[]; lastClose=null; pendingDir=0;
  sessionHigh=-Infinity; sessionLow=Infinity;
  document.getElementById('tape').innerHTML='';
  document.getElementById('statHigh').textContent='--';
  document.getElementById('statLow').textContent='--';
  draw();
});

document.getElementById('addCustomBtn').addEventListener('click', ()=>{
  const ticker = document.getElementById('customTicker').value.trim();
  const type = document.getElementById('customType').value;
  if(!ticker) return;
  const key = ticker.toUpperCase().replace('=X','').replace('=F','');
  customSymbols[key] = {
    type,
    ticker: type==='crypto' ? ticker.toLowerCase() : ticker,
    brick: type==='crypto' ? 1 : 0.01,
    dp: type==='crypto' ? 2 : 4
  };
  renderTabs();
  switchSymbol(key);
  document.getElementById('customTicker').value='';
});

// ---------- init ----------
renderTabs();
switchSymbol('BTCUSDT');
resizeCanvas();
</script>
</body>
</html>
