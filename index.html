<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renko Terminal</title>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --panel:#F8F9FD; --border:#E0E3EB;
    --txt:#131722; --muted:#787B86; --muted2:#9598A1;
    --up:#26A69A; --up-dim:#E7F6F3; --down:#EF5350; --down-dim:#FDEAEA;
    --accent:#2962FF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background:var(--bg); color:var(--txt); font-family:'Inter',sans-serif; overflow:hidden; }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{display:flex; flex-direction:column; height:100vh; width:100vw; background:var(--bg);}

  .price-header{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:10px 14px 6px; flex-shrink:0; }
  .sym-name{font-size:14px; font-weight:700;}
  .sym-badge{font-size:10px; font-weight:600; color:var(--muted); background:var(--panel); padding:2px 6px; border-radius:4px;}
  .price-now{font-size:26px; font-weight:700; font-family:'JetBrains Mono',monospace; letter-spacing:-0.5px;}
  .price-chg{font-size:13px; font-weight:600; font-family:'JetBrains Mono',monospace;}
  .price-chg.up{color:var(--up);} .price-chg.down{color:var(--down);}
  .live-dot{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--muted);
    background:var(--panel); padding:3px 8px; border-radius:20px; margin-left:auto;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--muted2);}
  .dot.live{background:var(--up); box-shadow:0 0 5px var(--up); animation:pulse 1.4s infinite;}
  .dot.poll{background:#FF9800; box-shadow:0 0 5px #FF9800; animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .toolbar{ display:flex; align-items:center; gap:8px; padding:6px 14px; flex-wrap:wrap;
    border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0; }
  .seg{display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;}
  .seg-btn{ padding:5px 10px; font-size:11.5px; font-weight:600; color:var(--muted); background:var(--bg);
    cursor:pointer; font-family:'JetBrains Mono',monospace; border-right:1px solid var(--border); }
  .seg-btn:last-child{border-right:none;}
  .seg-btn.active{background:var(--accent); color:#fff;}
  .tgroup{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); font-weight:600;}
  input[type=text],input[type=number]{ background:var(--bg); border:1px solid var(--border); color:var(--txt);
    padding:5px 7px; border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:12px; width:80px; }
  select{background:var(--bg); border:1px solid var(--border); color:var(--txt); padding:5px 7px; border-radius:5px; font-size:12px;}
  button.btn{ background:var(--bg); border:1px solid var(--border); color:var(--txt); padding:6px 11px;
    border-radius:5px; font-size:12px; cursor:pointer; font-weight:600; }
  button.btn:hover{border-color:var(--accent); color:var(--accent);}
  button.btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .tgroup label{display:flex; align-items:center; gap:3px; cursor:pointer; user-select:none; font-weight:500;}
  .tgroup input[type=checkbox]{accent-color:var(--accent); cursor:pointer;}
  .toolbar .spacer{flex:1;}

  .custom-row{ display:flex; align-items:flex-start; gap:8px; padding:6px 14px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); background:#FCFCFE; flex-shrink:0; }
  .custom-row textarea{ flex:1; min-width:260px; background:var(--bg); border:1px solid var(--border); color:var(--txt);
    padding:6px 8px; border-radius:5px; font-family:'JetBrains Mono',monospace; font-size:11px; resize:vertical; height:70px; line-height:1.5; }
  .custom-row span{padding-top:6px;}
  .err-note{font-size:10.5px; color:var(--down); display:none; padding:0 14px 4px; flex-shrink:0;}

  main{flex:1; position:relative; min-height:0;}
  #chart{position:absolute; inset:0;}
  .chart-msg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; font-size:13px; color:var(--muted); z-index:2; pointer-events:none; }
  .chart-msg .sub{font-size:11px; color:var(--muted2); margin-top:6px; font-family:'JetBrains Mono',monospace;}

  .stats-strip{ display:flex; gap:18px; padding:6px 14px; font-size:11px; color:var(--muted);
    border-top:1px solid var(--border); background:var(--panel); flex-shrink:0; flex-wrap:wrap; }
  .stats-strip b{font-family:'JetBrains Mono',monospace; color:var(--txt); font-weight:600;}
  .stats-strip .up b{color:var(--up);} .stats-strip .down b{color:var(--down);}

  .tape-strip{display:flex; gap:6px; padding:6px 14px; overflow-x:auto; flex-shrink:0; border-top:1px solid var(--border); background:var(--bg);}
  .tape-chip{ flex-shrink:0; font-size:10.5px; font-family:'JetBrains Mono',monospace; font-weight:600; padding:4px 8px; border-radius:5px; white-space:nowrap; }
  .tape-chip.up{background:var(--up-dim); color:var(--up);}
  .tape-chip.down{background:var(--down-dim); color:var(--down);}

  .watchlist{ display:flex; gap:6px; padding:8px 14px; overflow-x:auto; flex-shrink:0; border-top:1px solid var(--border); background:var(--panel); align-items:center; }
  .wtab{ flex-shrink:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:5px 11px;
    border-radius:6px; border:1px solid var(--border); background:var(--bg); cursor:pointer; font-family:'JetBrains Mono',monospace; }
  .wtab .wsym{font-size:11.5px; font-weight:700; color:var(--txt);}
  .wtab .wtf{font-size:9px; color:var(--muted);}
  .wtab.active{background:var(--accent); border-color:var(--accent);}
  .wtab.active .wsym, .wtab.active .wtf{color:#fff;}
</style>
</head>
<body>
<div id="app">

<div class="price-header">
  <div class="sym-name" id="lastSymbol">BTCUSDT</div>
  <div class="sym-badge" id="feedBadge">LIVE</div>
  <div class="price-now mono" id="lastPrice">--</div>
  <div class="price-chg mono" id="priceChg">--</div>
  <div class="live-dot"><div class="dot" id="statusDot"></div><span id="statusText">idle</span></div>
</div>

<div class="toolbar">
  <div class="seg">
    <div class="seg-btn active" id="chartTypeRenko">RENKO</div>
    <div class="seg-btn" id="chartTypeCandle">CANDLES</div>
  </div>
  <div class="tgroup" id="timeframeGroup" style="display:none;">TF
    <select id="timeframeSelect">
      <option value="1">1s</option><option value="5">5s</option><option value="15">15s</option>
      <option value="30">30s</option><option value="60">1m</option><option value="300">5m</option>
    </select>
  </div>
  <div class="tgroup" id="brickGroup">Brick
    <input type="number" id="brickSizeInput" step="any">
    <select id="brickModeSelect" style="width:64px;"><option value="abs">Value</option><option value="pct">%</option></select>
  </div>
  <button class="btn" id="resetBtn">Reset</button>
  <div class="tgroup">
    <label><input type="checkbox" id="indSMA"> SMA20</label>
    <label><input type="checkbox" id="indEMA"> EMA20</label>
    <label><input type="checkbox" id="indBB"> BB</label>
    <label><input type="checkbox" id="indST"> SuperTrend</label>
    <label><input type="checkbox" id="indZL"> ZLEMA</label>
    <label><input type="checkbox" id="indCustom"> Custom</label>
  </div>
  <div class="tgroup">Panel
    <select id="bottomPanelSelect"><option value="none">None</option><option value="rsi">RSI(14)</option><option value="macd">MACD</option></select>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnFull">⛶ Full Screen</button>
</div>

<div class="custom-row" id="customRow" style="display:none;">
  <span style="font-size:11px; color:var(--muted); font-weight:600;">function calc(opens,highs,lows,closes) {</span>
  <textarea id="customFormula" placeholder="return an array of numbers/null, same length as closes[]">const out = [];
for (let i = 0; i < closes.length; i++) {
  out.push(i >= 1 ? (closes[i] + closes[i-1]) / 2 : closes[i]);
}
return out;</textarea>
  <button class="btn" id="applyCustomBtn">Apply</button>
</div>
<div class="err-note" id="errNote"></div>

<main>
  <div id="chart"></div>
  <div class="chart-msg" id="chartMsg"></div>
</main>

<div class="stats-strip">
  <span>High <b id="statHigh">--</b></span>
  <span>Low <b id="statLow">--</b></span>
  <span class="up">Up <b id="statUp">0</b></span>
  <span class="down">Down <b id="statDown">0</b></span>
  <span>Ticks <b id="statTicks">0</b></span>
  <span id="dataNote" style="margin-left:auto; color:var(--muted2);"></span>
</div>

<div class="tape-strip" id="tape"></div>

<div class="watchlist" id="watchlist"></div>

</div>

<script>
// =========================================================
// symbols — Binance USD-M Futures only (this venue lists XAUUSDT/XAGUSDT
// as gold/silver perpetuals alongside BTC/ETH/SOL, so one API covers all 5)
// =========================================================
const SYMBOLS = {
  XAUUSDT:{ticker:'XAUUSDT', brick:2,    dp:2, mode:'abs'},
  XAGUSDT:{ticker:'XAGUSDT', brick:0.05, dp:3, mode:'abs'},
  BTCUSDT:{ticker:'BTCUSDT', brick:8,    dp:2, mode:'abs'},
  ETHUSDT:{ticker:'ETHUSDT', brick:0.6,  dp:2, mode:'abs'},
  SOLUSDT:{ticker:'SOLUSDT', brick:0.05, dp:3, mode:'abs'},
};
function getCfg(key){ return SYMBOLS[key]; }

// =========================================================
// state
// =========================================================
let currentKey = null;
let bricks = [];          // {open, close, dir, time}
let candles = [];
let currentCandle = null;
let timeframeSec = 1;
let chartType = 'renko';
let lastClose = null;
let pendingDir = 0;
let sessionHigh = -Infinity, sessionLow = Infinity, tickCount = 0, sessionOpen = null;
let ws = null, watchdogTimer = null;
let lastFeedError = null;
let showSMA=false, showEMA=false, showBB=false, showST=false, showZL=false, showCustom=false, bottomPanel='none';
let customFn = null, customErr = null;

function fmt(v){ const cfg = getCfg(currentKey); return v.toFixed(cfg ? cfg.dp : 2); }
function showErr(msg){
  const el = document.getElementById('errNote');
  if(msg){ el.textContent = msg; el.style.display='block'; console.error(msg); }
  else { el.style.display='none'; el.textContent=''; }
}

// =========================================================
// Lightweight Charts
// =========================================================
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout:{ background:{type:'solid', color:'#FFFFFF'}, textColor:'#131722' },
  grid:{ vertLines:{color:'#EEF0F5'}, horzLines:{color:'#EEF0F5'} },
  rightPriceScale:{ autoScale:true, mode:0, borderColor:'#E0E3EB' },
  timeScale:{ borderColor:'#E0E3EB', timeVisible:true, secondsVisible:true },
  crosshair:{ mode: LightweightCharts.CrosshairMode.Normal },
  handleScroll:true, handleScale:true,
});
let mainSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
  upColor:'#26A69A', downColor:'#EF5350', borderUpColor:'#26A69A', borderDownColor:'#EF5350',
  wickUpColor:'#26A69A', wickDownColor:'#EF5350',
});
let smaSeries=null, emaSeries=null, bbUpSeries=null, bbDnSeries=null;
let stUpSeries=null, stDnSeries=null, zlSeries=null, customSeries=null;
let panelSeries=null, panelSeries2=null;

function resizeChart(){
  const box = document.querySelector('main').getBoundingClientRect();
  chart.resize(box.width, box.height);
}
window.addEventListener('resize', resizeChart);
new ResizeObserver(resizeChart).observe(document.querySelector('main'));

// =========================================================
// renko engine — tick-driven, no timeframe involved.
// Reversal needs 2x brick travel; the confirming box is consumed silently
// (lastClose stepped by 1 brick, no visible brick) before normal 1-brick
// continuation resumes in the new direction.
// =========================================================
function brickSizeFor(cfg, refPrice){ return cfg.mode==='pct' ? Math.abs(refPrice)*(cfg.brick/100) : cfg.brick; }

function commitRenko(price, ts, silent){
  ts = ts || Date.now();
  const cfg = getCfg(currentKey);
  if(lastClose === null){
    const size0 = brickSizeFor(cfg, price);
    lastClose = Math.round(price/size0)*size0;
    return;
  }
  let diff = price - lastClose;
  while(true){
    const size = brickSizeFor(cfg, lastClose);
    const dir = Math.sign(diff);
    if(dir === 0) break;
    if(pendingDir !== 0 && dir !== pendingDir){
      if(Math.abs(diff) < size*2) break;
      lastClose = lastClose + dir*size;   // silent consume, no brick
      pendingDir = dir;
      diff = price - lastClose;
      continue;
    }
    if(Math.abs(diff) < size) break;
    const open = lastClose, close = lastClose + dir*size;
    bricks.push({open, close, dir, time: ts});
    lastClose = close;
    diff = price - lastClose;
    pendingDir = dir;
    if(!silent) addTapeItem(bricks[bricks.length-1]);
  }
  if(bricks.length > 400) bricks.splice(0, bricks.length-400);
}

// =========================================================
// candle engine (time-bucketed, only used in Candles chart type)
// =========================================================
function feedCandle(price, ts){
  const bucket = Math.floor(ts/1000/timeframeSec)*timeframeSec*1000;
  if(!currentCandle || currentCandle.time !== bucket){
    currentCandle = {time:bucket, open:price, high:price, low:price, close:price};
    candles.push(currentCandle);
    if(candles.length > 400) candles.shift();
  } else {
    currentCandle.high = Math.max(currentCandle.high, price);
    currentCandle.low = Math.min(currentCandle.low, price);
    currentCandle.close = price;
  }
}

// =========================================================
// tick intake
// =========================================================
function feedPrice(price){
  lastFeedError = null;
  tickCount++;
  if(sessionOpen === null) sessionOpen = price;
  if(price > sessionHigh) sessionHigh = price;
  if(price < sessionLow) sessionLow = price;
  feedCandle(price, Date.now());
  commitRenko(price);              // always tick-driven, every tick
  updateHeader(price);
  updateCounts();
  renderChart();
}

// klines: [{t,o,h,l,c}] ascending. Candle engine gets the real close per bucket;
// Renko engine gets each bar expanded into its intrabar open→low/high→high/low→close
// sequence so pullbacks inside a 1s bar aren't lost (previously only the close was
// used, which silently discarded intrabar reversals and biased bricks one-sided).
function seedHistory(klines){
  if(!klines.length) return;
  klines.forEach(k=>{
    tickCount++;
    if(sessionOpen === null) sessionOpen = k.o;
    if(k.h > sessionHigh) sessionHigh = k.h;
    if(k.l < sessionLow) sessionLow = k.l;
    feedCandle(k.c, k.t);
    const bullish = k.c >= k.o;
    const seq = bullish ? [k.o, k.l, k.h, k.c] : [k.o, k.h, k.l, k.c];
    seq.forEach(p => commitRenko(p, k.t, true));
  });
  const last = klines[klines.length-1].c;
  document.getElementById('tape').innerHTML = '';
  bricks.slice(-15).forEach(b => addTapeItem(b));
  updateHeader(last);
  updateCounts();
  renderChart();
  chart.timeScale().fitContent();
}

function updateHeader(price){
  document.getElementById('statTicks').textContent = tickCount;
  document.getElementById('statHigh').textContent = fmt(sessionHigh);
  document.getElementById('statLow').textContent = fmt(sessionLow);
  document.getElementById('lastPrice').textContent = fmt(price);
  const chg = price - sessionOpen;
  const pct = sessionOpen ? (chg/sessionOpen)*100 : 0;
  const chgEl = document.getElementById('priceChg');
  chgEl.textContent = (chg>=0?'+':'') + fmt(chg) + '  (' + (pct>=0?'+':'') + pct.toFixed(2) + '%)';
  chgEl.className = 'price-chg mono ' + (chg>=0?'up':'down');
}
function updateCounts(){
  document.getElementById('statUp').textContent = bricks.filter(b=>b.dir===1).length;
  document.getElementById('statDown').textContent = bricks.filter(b=>b.dir===-1).length;
}
function addTapeItem(b){
  const el = document.createElement('div');
  el.className = 'tape-chip ' + (b.dir===1?'up':'down');
  el.textContent = (b.dir===1?'▲':'▼') + ' ' + fmt(b.close);
  const tape = document.getElementById('tape');
  tape.prepend(el);
  while(tape.children.length > 30) tape.removeChild(tape.lastChild);
}

// =========================================================
// indicators — period auto-shrinks to available bars so they show up
// immediately instead of staying null until 20 bars/bricks exist.
// =========================================================
function effPeriod(want, len){ return Math.max(2, Math.min(want, len-1)); }

function sma(arr, want){
  const period = effPeriod(want, arr.length);
  const out = new Array(arr.length).fill(null);
  for(let i=period-1;i<arr.length;i++){ let s=0; for(let j=i-period+1;j<=i;j++) s+=arr[j]; out[i]=s/period; }
  return out;
}
function ema(arr, want){
  const period = effPeriod(want, arr.length);
  const out = new Array(arr.length).fill(null);
  const k = 2/(period+1); let prev=null;
  for(let i=0;i<arr.length;i++){
    if(prev===null){ if(i>=period-1){ let s=0; for(let j=i-period+1;j<=i;j++) s+=arr[j]; prev=s/period; out[i]=prev; } }
    else { prev = arr[i]*k + prev*(1-k); out[i]=prev; }
  }
  return out;
}
function bollinger(arr, want, mult){
  const period = effPeriod(want, arr.length);
  const mid = sma(arr, period); const upper=[], lower=[];
  for(let i=0;i<arr.length;i++){
    if(mid[i]===null){ upper.push(null); lower.push(null); continue; }
    let s=0; for(let j=i-period+1;j<=i;j++){ const d=arr[j]-mid[i]; s+=d*d; }
    const sd=Math.sqrt(s/period); upper.push(mid[i]+mult*sd); lower.push(mid[i]-mult*sd);
  }
  return {upper, lower};
}
function rsi(arr, want){
  const period = effPeriod(want, arr.length);
  const out = new Array(arr.length).fill(null); let avgG=0, avgL=0;
  for(let i=1;i<arr.length;i++){
    const ch=arr[i]-arr[i-1]; const g=Math.max(ch,0), l=Math.max(-ch,0);
    if(i<=period){ avgG+=g; avgL+=l; if(i===period){ avgG/=period; avgL/=period; const rs=avgL===0?100:avgG/avgL; out[i]=100-(100/(1+rs)); } }
    else { avgG=(avgG*(period-1)+g)/period; avgL=(avgL*(period-1)+l)/period; const rs=avgL===0?100:avgG/avgL; out[i]=100-(100/(1+rs)); }
  }
  return out;
}
function macd(arr){
  const eF=ema(arr,12), eS=ema(arr,26);
  const line = arr.map((_,i)=> (eF[i]!==null && eS[i]!==null) ? eF[i]-eS[i] : null);
  const validIdx=[], validVals=[];
  line.forEach((v,i)=>{ if(v!==null){ validIdx.push(i); validVals.push(v); } });
  const sigValid = ema(validVals, 9);
  const signal = new Array(arr.length).fill(null);
  validIdx.forEach((idx,k)=> signal[idx]=sigValid[k]);
  return {line, signal};
}

// ZLEMA (Zero-Lag EMA) — ported from the pasted "Ankit" script's core trend line
// (the Kalman pre-filter step is skipped for simplicity — this uses raw close as source)
function zlema(arr, want){
  const period = effPeriod(want, arr.length);
  const lag = Math.round((period-1)/2);
  const boosted = arr.map((v,i)=> v + (v - arr[Math.max(0,i-lag)]));
  return ema(boosted, period);
}

// SuperTrend: needs high/low/close per bar. For renko bricks (no wick) we use
// max(open,close)/min(open,close) as high/low, same convention as the candle body.
function superTrend(bars, want, mult){
  const period = effPeriod(want, bars.length);
  const n = bars.length;
  const tr = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    const h=bars[i].high, l=bars[i].low, pc = i>0?bars[i-1].close:bars[i].close;
    tr[i] = Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));
  }
  const atr = new Array(n).fill(null);
  for(let i=0;i<n;i++){
    if(i<period-1) continue;
    if(i===period-1){ let s=0; for(let j=0;j<period;j++) s+=tr[j]; atr[i]=s/period; }
    else atr[i] = (atr[i-1]*(period-1)+tr[i])/period;
  }
  const st = new Array(n).fill(null);
  const dir = new Array(n).fill(1);
  let fUp=null, fLow=null;
  for(let i=0;i<n;i++){
    if(atr[i]===null) continue;
    const mid = (bars[i].high+bars[i].low)/2;
    const bUp = mid + mult*atr[i], bLow = mid - mult*atr[i];
    fUp = (fUp===null) ? bUp : ((bUp<fUp || bars[i-1].close>fUp) ? bUp : fUp);
    fLow = (fLow===null) ? bLow : ((bLow>fLow || bars[i-1].close<fLow) ? bLow : fLow);
    if(i===0 || st[i-1]===null){ dir[i] = bars[i].close >= fLow ? 1 : -1; }
    else if(dir[i-1]===1) dir[i] = bars[i].close < fLow ? -1 : 1;
    else dir[i] = bars[i].close > fUp ? 1 : -1;
    st[i] = dir[i]===1 ? fLow : fUp;
  }
  return {st, dir};
}

// =========================================================
// render
// =========================================================
function activeSeries(){ return chartType==='renko' ? bricks : candles; }

function timesFor(series){
  if(chartType==='candle') return series.map(c=>Math.floor(c.time/1000));
  const base = Math.floor(Date.now()/1000);
  const n = series.length;
  return series.map((_,i)=> base - (n-1-i));
}

function safeLine(existingRef, color, lineWidth){
  try{ return existingRef || chart.addSeries(LightweightCharts.LineSeries, {color, lineWidth: lineWidth||1}); }
  catch(e){ showErr('Indicator series failed: '+e.message); return null; }
}
function safeRemove(ref){ if(ref){ try{ chart.removeSeries(ref); }catch(e){} } return null; }
function toPts(vals, times){ const out=[]; for(let i=0;i<vals.length;i++){ if(vals[i]!==null && vals[i]!==undefined && !isNaN(vals[i])) out.push({time:times[i], value:vals[i]}); } return out; }

function renderChart(){
  const series = activeSeries();
  const msg = document.getElementById('chartMsg');

  if(!series.length){
    mainSeries.setData([]);
    if(lastFeedError){
      msg.innerHTML = lastFeedError + '<div class="sub">Try another symbol or check network/ad-blocker.</div>';
    } else if(chartType==='renko' && lastClose !== null){
      const cfg = getCfg(currentKey);
      const size = brickSizeFor(cfg, lastClose);
      const range = sessionHigh - sessionLow;
      const needTxt = cfg.mode==='pct' ? `${cfg.brick}% (~${size.toFixed(cfg.dp)})` : `${size}`;
      msg.innerHTML = 'Live · waiting for first brick' + `<div class="sub">Need ${needTxt} move · so far ${range.toFixed(cfg.dp)}</div>`;
    } else {
      msg.textContent = 'Waiting for price data…';
    }
    return;
  }
  msg.textContent = '';

  const times = timesFor(series);
  const barsFull = series.map((s,i)=>{
    if(chartType==='renko') return { time: times[i], open:s.open, close:s.close, high:Math.max(s.open,s.close), low:Math.min(s.open,s.close), dir:s.dir };
    return { time: times[i], open:s.open, high:s.high, low:s.low, close:s.close };
  });
  mainSeries.setData(barsFull.map(({dir, ...b})=>b));

  const closes = series.map(s=>s.close);
  showErr(null);

  try{
    if(showSMA){ smaSeries = safeLine(smaSeries, '#2962FF'); if(smaSeries) smaSeries.setData(toPts(sma(closes,20), times)); }
    else smaSeries = safeRemove(smaSeries);
  }catch(e){ showErr('SMA error: '+e.message); }

  try{
    if(showEMA){ emaSeries = safeLine(emaSeries, '#FF6D00'); if(emaSeries) emaSeries.setData(toPts(ema(closes,20), times)); }
    else emaSeries = safeRemove(emaSeries);
  }catch(e){ showErr('EMA error: '+e.message); }

  try{
    if(showBB){
      const bb = bollinger(closes,20,2);
      bbUpSeries = safeLine(bbUpSeries, 'rgba(126,87,194,0.7)'); if(bbUpSeries) bbUpSeries.setData(toPts(bb.upper, times));
      bbDnSeries = safeLine(bbDnSeries, 'rgba(126,87,194,0.7)'); if(bbDnSeries) bbDnSeries.setData(toPts(bb.lower, times));
    } else { bbUpSeries = safeRemove(bbUpSeries); bbDnSeries = safeRemove(bbDnSeries); }
  }catch(e){ showErr('Bollinger error: '+e.message); }

  try{
    if(showST){
      const {st, dir} = superTrend(barsFull, 10, 3);
      const upVals = st.map((v,i)=> (v!==null && dir[i]===1) ? v : null);
      const dnVals = st.map((v,i)=> (v!==null && dir[i]===-1) ? v : null);
      stUpSeries = safeLine(stUpSeries, '#26A69A', 2); if(stUpSeries) stUpSeries.setData(toPts(upVals, times));
      stDnSeries = safeLine(stDnSeries, '#EF5350', 2); if(stDnSeries) stDnSeries.setData(toPts(dnVals, times));
    } else { stUpSeries = safeRemove(stUpSeries); stDnSeries = safeRemove(stDnSeries); }
  }catch(e){ showErr('SuperTrend error: '+e.message); }

  try{
    if(showZL){ zlSeries = safeLine(zlSeries, '#00BFA5', 2); if(zlSeries) zlSeries.setData(toPts(zlema(closes,55), times)); }
    else zlSeries = safeRemove(zlSeries);
  }catch(e){ showErr('ZLEMA error: '+e.message); }

  try{
    if(showCustom && customFn){
      const opens=series.map(s=>s.open), highs=barsFull.map(b=>b.high), lows=barsFull.map(b=>b.low);
      let vals;
      try{ vals = customFn(opens,highs,lows,closes); }catch(e){ vals = null; showErr('Custom indicator runtime error: '+e.message); }
      if(Array.isArray(vals)){
        customSeries = safeLine(customSeries, '#9C27B0', 2);
        if(customSeries) customSeries.setData(toPts(vals.map(v=> (typeof v==='number'&&!isNaN(v))?v:null), times));
      }
    } else { customSeries = safeRemove(customSeries); }
  }catch(e){ showErr('Custom indicator error: '+e.message); }

  try{
    if(bottomPanel==='rsi'){
      panelSeries2 = safeRemove(panelSeries2);
      panelSeries = panelSeries || chart.addSeries(LightweightCharts.LineSeries, {color:'#2962FF', lineWidth:1}, 1);
      panelSeries.setData(toPts(rsi(closes,14), times));
    } else if(bottomPanel==='macd'){
      panelSeries = panelSeries || chart.addSeries(LightweightCharts.LineSeries, {color:'#2962FF', lineWidth:1}, 1);
      panelSeries2 = panelSeries2 || chart.addSeries(LightweightCharts.LineSeries, {color:'#FF6D00', lineWidth:1}, 1);
      const m = macd(closes);
      panelSeries.setData(toPts(m.line, times));
      panelSeries2.setData(toPts(m.signal, times));
    } else { panelSeries = safeRemove(panelSeries); panelSeries2 = safeRemove(panelSeries2); }
  }catch(e){ showErr('Panel indicator error: '+e.message); }
}

// =========================================================
// Binance USD-M Futures data connection (covers all 5 symbols)
// =========================================================
function setStatus(mode, text){
  const dot = document.getElementById('statusDot');
  dot.className = 'dot' + (mode?(' '+mode):'');
  document.getElementById('statusText').textContent = text;
  document.getElementById('feedBadge').textContent = mode==='live' ? 'LIVE' : '···';
}
function teardown(){
  if(ws){ ws.onclose=null; ws.close(); ws=null; }
  if(watchdogTimer){ clearTimeout(watchdogTimer); watchdogTimer=null; }
}
async function fetchKlines(symbol, limit){
  const url = `https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=1s&limit=${limit}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('klines HTTP '+res.status);
  const rows = await res.json();
  return rows.map(r=>({ t:r[0], o:parseFloat(r[1]), h:parseFloat(r[2]), l:parseFloat(r[3]), c:parseFloat(r[4]) }));
}
async function connectSymbol(cfg){
  setStatus('live','loading history…');
  try{
    const hist = await fetchKlines(cfg.ticker, 500);
    if(hist.length) seedHistory(hist);
  }catch(e){ console.warn('Backfill failed:', e); }

  setStatus('live','connecting…');
  watchdogTimer = setTimeout(()=>{
    if(tickCount===0){
      lastFeedError = 'No data after 6s. This browser/preview may be blocking outbound WebSocket connections.';
      setStatus('','blocked?'); renderChart();
    }
  }, 6000);
  try{
    ws = new WebSocket(`wss://fstream.binance.com/ws/${cfg.ticker.toLowerCase()}@trade`);
  }catch(e){
    lastFeedError = 'WebSocket could not be created: ' + e.message;
    setStatus('','error'); renderChart();
    return;
  }
  ws.onopen = ()=> setStatus('live','LIVE · Binance Futures tick stream');
  ws.onmessage = ev=>{
    clearTimeout(watchdogTimer);
    const d = JSON.parse(ev.data);
    if(d.p) feedPrice(parseFloat(d.p));
  };
  ws.onerror = ()=>{ lastFeedError = 'WebSocket connection error — network/firewall likely blocking wss://.'; setStatus('','error'); renderChart(); };
  ws.onclose = ()=> setStatus('','disconnected');
}

function switchSymbol(key){
  teardown();
  currentKey = key;
  bricks=[]; candles=[]; currentCandle=null; lastClose=null; pendingDir=0;
  sessionOpen=null; lastFeedError=null; sessionHigh=-Infinity; sessionLow=Infinity; tickCount=0;
  document.getElementById('tape').innerHTML='';
  document.getElementById('statUp').textContent='0';
  document.getElementById('statDown').textContent='0';
  document.getElementById('statTicks').textContent='0';
  document.getElementById('statHigh').textContent='--';
  document.getElementById('statLow').textContent='--';
  document.getElementById('lastPrice').textContent='--';
  document.getElementById('priceChg').textContent='--';
  document.getElementById('lastSymbol').textContent = key;

  const cfg = getCfg(key);
  document.getElementById('brickSizeInput').value = cfg.brick;
  document.getElementById('brickModeSelect').value = cfg.mode || 'abs';
  document.getElementById('dataNote').textContent = 'Binance Futures · klines backfill + live ticks';

  document.querySelectorAll('.wtab').forEach(t=> t.classList.toggle('active', t.dataset.key===key));
  mainSeries.setData([]);
  renderChart();
  connectSymbol(cfg);
}

// =========================================================
// UI wiring
// =========================================================
function renderWatchlist(){
  const wrap = document.getElementById('watchlist');
  wrap.innerHTML = '';
  Object.keys(SYMBOLS).forEach(key=>{
    const btn = document.createElement('div');
    btn.className = 'wtab' + (key===currentKey?' active':'');
    btn.dataset.key = key;
    btn.innerHTML = `<span class="wsym">${key}</span><span class="wtf">live</span>`;
    btn.onclick = ()=> switchSymbol(key);
    wrap.appendChild(btn);
  });
}

document.getElementById('brickSizeInput').addEventListener('change', e=>{
  const cfg = getCfg(currentKey); const v = parseFloat(e.target.value);
  if(v>0){ cfg.brick=v; bricks=[]; lastClose=null; pendingDir=0; document.getElementById('tape').innerHTML=''; renderChart(); }
});
document.getElementById('brickModeSelect').addEventListener('change', e=>{
  const cfg = getCfg(currentKey); const newMode = e.target.value;
  if(newMode === cfg.mode) return;
  const priceRef = lastClose !== null ? lastClose : parseFloat(document.getElementById('lastPrice').textContent);
  if(priceRef && !isNaN(priceRef)){
    if(newMode==='pct') cfg.brick = +((cfg.brick/priceRef)*100).toFixed(4);
    else cfg.brick = +(priceRef*(cfg.brick/100)).toFixed(Math.max(cfg.dp,2));
  }
  cfg.mode = newMode;
  document.getElementById('brickSizeInput').value = cfg.brick;
  bricks=[]; lastClose=null; pendingDir=0; document.getElementById('tape').innerHTML='';
  renderChart();
});
document.getElementById('resetBtn').addEventListener('click', ()=>{
  bricks=[]; candles=[]; currentCandle=null; lastClose=null; pendingDir=0;
  sessionHigh=-Infinity; sessionLow=Infinity;
  document.getElementById('tape').innerHTML='';
  document.getElementById('statHigh').textContent='--'; document.getElementById('statLow').textContent='--';
  renderChart();
});
document.getElementById('chartTypeRenko').addEventListener('click', ()=>{
  chartType='renko';
  document.getElementById('chartTypeRenko').classList.add('active');
  document.getElementById('chartTypeCandle').classList.remove('active');
  document.getElementById('brickGroup').style.display='flex';
  document.getElementById('timeframeGroup').style.display='none';
  renderChart();
});
document.getElementById('chartTypeCandle').addEventListener('click', ()=>{
  chartType='candle';
  document.getElementById('chartTypeCandle').classList.add('active');
  document.getElementById('chartTypeRenko').classList.remove('active');
  document.getElementById('brickGroup').style.display='none';
  document.getElementById('timeframeGroup').style.display='flex';
  renderChart();
});
document.getElementById('timeframeSelect').addEventListener('change', e=>{
  timeframeSec = parseInt(e.target.value);
  candles=[]; currentCandle=null;
  renderChart();
});
document.getElementById('indSMA').addEventListener('change', e=>{ showSMA=e.target.checked; renderChart(); });
document.getElementById('indEMA').addEventListener('change', e=>{ showEMA=e.target.checked; renderChart(); });
document.getElementById('indBB').addEventListener('change', e=>{ showBB=e.target.checked; renderChart(); });
document.getElementById('indST').addEventListener('change', e=>{ showST=e.target.checked; renderChart(); });
document.getElementById('indZL').addEventListener('change', e=>{ showZL=e.target.checked; renderChart(); });
document.getElementById('indCustom').addEventListener('change', e=>{
  showCustom = e.target.checked;
  document.getElementById('customRow').style.display = showCustom ? 'flex' : 'none';
  if(showCustom && !customFn) applyCustomFormula();
  renderChart();
});
document.getElementById('bottomPanelSelect').addEventListener('change', e=>{ bottomPanel=e.target.value; renderChart(); });

function applyCustomFormula(){
  const src = document.getElementById('customFormula').value;
  try{
    // eslint-disable-next-line no-new-func
    customFn = new Function('opens','highs','lows','closes', src);
    const test = customFn([1,2],[1,2],[1,2],[1,2]); // smoke-test call
    if(!Array.isArray(test)) throw new Error('function must return an array');
    showErr(null);
  }catch(e){
    customFn = null;
    showErr('Custom formula error: ' + e.message);
  }
  renderChart();
}
document.getElementById('applyCustomBtn').addEventListener('click', applyCustomFormula);

document.getElementById('btnFull').addEventListener('click', ()=>{
  const el = document.getElementById('app');
  if(!document.fullscreenElement) (el.requestFullscreen||el.webkitRequestFullscreen)?.call(el);
  else (document.exitFullscreen||document.webkitExitFullscreen)?.call(document);
});
document.addEventListener('fullscreenchange', ()=>{
  document.getElementById('btnFull').classList.toggle('active', !!document.fullscreenElement);
  setTimeout(resizeChart, 50);
});

// =========================================================
// init
// =========================================================
renderWatchlist();
switchSymbol('BTCUSDT');
resizeChart();
